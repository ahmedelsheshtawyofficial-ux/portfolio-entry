<style>
/* =========================================================
   AHMED ELSHESHTAWY — ENTRY PAGE
   Same visual identity as the main portfolio:
   Black / Off-white / Orange editorial finance aesthetic
   ========================================================= */
:root{
  --bg:#f4f2ec;
  --surface:#ebe8df;
  --surface-2:#dfdbd1;
  --ink:#0a0a0a;
  --ink-soft:#5d5b56;
  --ink-faint:#92908a;
  --line:#d7d3c9;
  --accent:#ff4d00;
  --accent-dark:#d93d00;
  --accent-soft:#fff0e9;
  --gold:#ff4d00;
  --white:#f8f6f0;
  --black:#050505;
  --serif:'Space Grotesk',sans-serif;
  --sans:'Inter',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --shadow:0 24px 70px rgba(10,10,10,.10);
}
:root[data-theme="dark"]{
  --bg:#0d0d0d;
  --surface:#161616;
  --surface-2:#1e1e1e;
  --ink:#f2efe9;
  --ink-soft:#a8a49b;
  --ink-faint:#726e66;
  --line:#2a2a2a;
  --white:#161616;
  --accent-soft:#26170f;
  --gold-soft:#26170f;
  --shadow:0 24px 70px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{background:var(--bg);}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
a{color:inherit;text-decoration:none;}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;}

.backdrop{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 460px at 8% -10%,rgba(255,77,0,.13),transparent 62%),
    radial-gradient(520px 420px at 110% 110%,rgba(255,77,0,.07),transparent 58%);
  opacity:1;
  transition:opacity .3s ease;
}
:root[data-theme="dark"] .backdrop{
  background:
    radial-gradient(620px 460px at 8% -10%,rgba(255,77,0,.12),transparent 62%),
    radial-gradient(520px 420px at 110% 110%,rgba(255,77,0,.06),transparent 58%);
}

/* Header */
header{
  position:relative;
  z-index:2;
  padding:24px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:var(--serif);
  font-weight:700;
  font-size:15px;
}
.brand-mark{
  width:46px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  overflow:visible;
  background:transparent;
}
.brand-mark img{
  width:46px;
  height:40px;
  object-fit:contain;
}
.brand-mark .logo-dark{
  display:none;
}
:root[data-theme="dark"] .brand-mark .logo-light{
  display:none;
}
:root[data-theme="dark"] .brand-mark .logo-dark{
  display:block;
}

/* Day / night control — matches the main portfolio controls */
.theme-toggle{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  color:var(--ink);
  background:color-mix(in srgb,var(--surface) 72%,transparent);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  transition:background .2s,border-color .2s,transform .2s,color .2s;
}
.theme-toggle:hover{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  transform:translateY(-1px);
}
.theme-toggle .icon-sun{display:inline-block;}
.theme-toggle .icon-moon{display:none;}
[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
[data-theme="dark"] .theme-toggle .icon-moon{display:inline-block;}

/* Main */
main{
  position:relative;
  z-index:1;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 24px 58px;
}
.card{
  width:100%;
  max-width:560px;
  text-align:center;
  padding:42px 38px 44px;
  border:1px solid var(--line);
  border-radius:30px;
  background:color-mix(in srgb,var(--surface) 34%,transparent);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;
}
.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--accent);
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px;
}
.eyebrow::before,.eyebrow::after{
  content:"";
  width:18px;
  height:1px;
  background:var(--accent);
}
.portrait{
  width:132px;
  height:132px;
  border-radius:50%;
  margin:0 auto 28px;
  overflow:hidden;
  background:var(--surface);
  border:2px solid var(--accent);
  box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 10%,transparent);
}
.portrait img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.12);
}
h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(28px,4.5vw,40px);
  line-height:1.16;
  letter-spacing:-.02em;
  margin-bottom:14px;
}
.role{
  font-family:var(--serif);
  font-weight:600;
  color:var(--accent);
  font-size:16px;
  margin-bottom:18px;
}
p.sub{
  color:var(--ink-soft);
  font-size:15.5px;
  max-width:430px;
  margin:0 auto 34px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:var(--ink);
  color:var(--bg);
  padding:15px 29px;
  border-radius:100px;
  font-size:14.5px;
  font-weight:600;
  border:1px solid var(--ink);
  transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease;
}
.btn:hover{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  transform:translateY(-2px);
}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.hint{
  margin-top:18px;
  font-family:var(--mono);
  font-size:10.5px;
  letter-spacing:.03em;
  color:var(--ink-faint);
}

/* Footer */
footer{
  position:relative;
  z-index:1;
  padding:22px 24px 28px;
  text-align:center;
  font-family:var(--mono);
  font-size:11px;
  color:var(--ink-faint);
  border-top:1px solid var(--line);
}
footer a{color:var(--ink-soft);transition:color .2s;}
footer a:hover{color:var(--accent);}

@media(max-width:600px){
  header{padding:20px;}
  main{padding:12px 16px 42px;}
  .card{
    padding:34px 22px 36px;
    border-radius:24px;
  }
  .portrait{width:116px;height:116px;margin-bottom:24px;}
  p.sub{font-size:15px;margin-bottom:30px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;}
}
</style>
</head>
